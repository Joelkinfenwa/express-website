<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orders tracker | Express Pathology</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#17302A;--ink:#1C2420;--ivory:#F7F4EF;--sand:#EFEBE3;--peach:#F2A981;--clay:#A4502E;--soft:#5A645E;--line:#DCE0D8;--ok:#1F6B47}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--forest);color:var(--ivory)}
.logo{font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.04em;white-space:nowrap}
.logo i{font-style:normal;color:var(--peach)}
.search{flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;min-height:42px;border:0;border-radius:999px;padding:0 18px;background:rgba(255,255,255,.12);color:var(--ivory)}
.search input::placeholder{color:#B9C6BF}
.top .out{background:none;border:0;color:#C5D1CA;font-size:14px;padding:8px}
main{max-width:980px;margin:0 auto;padding:24px 20px 80px}
/* Sign in */
.login{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-family:'Instrument Sans',sans-serif;font-size:28px;letter-spacing:-.03em}
.login input{min-height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff}
.btn{min-height:48px;border:0;border-radius:12px;background:var(--forest);color:var(--ivory);font-weight:700;padding:0 20px}
.btn.light{background:#fff;color:var(--forest);border:1px solid var(--line)}
.msg{font-size:14px;color:var(--soft);margin:0}
/* Queues */
.rbox{border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;background:#FBFAF7}.rbox h4{margin:0 0 6px;font-size:15px}.rbox p{margin:0 0 10px;font-size:14px;color:var(--soft)}.rbox input[type=file]{display:block;margin:0 0 10px;max-width:100%}.rbox .sent{color:#1F7A4D;font-weight:700}
.addjob{float:right;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:700;color:var(--forest)}
.jobform{background:#fff;border:1px solid var(--forest);border-radius:18px;padding:18px;margin-bottom:18px}.jobform h3{margin:0 0 10px}
.sections{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.sec{border:0;background:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:15px;color:var(--soft);display:flex;gap:8px;align-items:center}
.sec b{font-size:12px;background:var(--sand);color:var(--ink);border-radius:999px;padding:1px 8px}
.sec[aria-selected="true"]{background:var(--forest);color:var(--ivory)}
.sec[aria-selected="true"] b{background:rgba(255,255,255,.18);color:var(--ivory)}
.queues{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:22px}
.q{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left}
.q b{font-family:'Instrument Sans',sans-serif;font-size:30px;line-height:1;letter-spacing:-.03em}
.q span{font-size:14px;font-weight:600;color:var(--soft)}
.q[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--ivory)}
.q[aria-pressed="true"] span{color:#C5D1CA}
.q.alert b{color:var(--clay)}.q[aria-pressed="true"].alert b{color:var(--peach)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.head h2{margin:0;font-family:'Instrument Sans',sans-serif;font-size:24px;letter-spacing:-.02em}
.head p{margin:0;color:var(--soft);font-size:14px}
/* Order cards */
.card{display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:10px}
.card.open{border-color:var(--forest);box-shadow:0 0 0 1px var(--forest)}
.who{min-width:0;cursor:pointer}
.l1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-weight:700;font-size:17px}
.num{font-size:14px;color:var(--soft)}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.tag.pvt{background:#E5ECE8;color:var(--forest)}.tag.gp{background:#FBE1D3;color:#7A3A1B}.tag.ref{background:#DDE6F4;color:#1F3A66}
.tag.pz{background:#1F2B26;color:#F2A981}
.tag.job{background:#DCEBE3;color:#1F5A3F}
.tag.inv{background:#EDE4F7;color:#4A2E7A}
.tag.fast{background:#FFF0D6;color:#7A4A00}
.tag.warn{background:#FBE3DA;color:#8A3B1E}
.l2{font-size:14px;color:var(--soft);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l3{font-size:14px;margin-top:4px;color:var(--ink)}
.l3 strong{color:var(--forest)}
.go{min-height:44px;border:0;border-radius:12px;background:var(--forest);color:var(--ivory);font-weight:700;padding:0 18px;white-space:nowrap}
.go.done{background:#E4EFE9;color:var(--ok)}
/* Expanded detail */
.detail{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.checks{display:flex;flex-direction:column;gap:2px;background:var(--sand);border-radius:14px;padding:12px 14px;grid-column:1/-1}
.checks-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}.checks-h span{color:var(--soft);font-weight:600}
.chk{display:flex;align-items:center;gap:10px;min-height:38px;font-size:15px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.05)}
.chk input{width:20px;height:20px;accent-color:var(--forest);flex:none}
.chk input:checked+span{color:var(--soft);text-decoration:line-through}
.detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.detail dt{color:var(--soft)}.detail dd{margin:0;word-break:break-word}
.detail a{color:var(--forest)}
.form{display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--soft)}
.form input,.form select,.form textarea{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;font-size:15px;font-weight:400;color:var(--ink)}
.form textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta{font-size:12px;color:var(--soft)}
.shopnote{background:#FBE3DA;color:#8A3B1E;border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 14px}
#revbtn{margin-left:auto}
.search:not([hidden])+#revbtn{margin-left:0}
.panel{overflow-x:auto}
.linkbtn{background:none;border:0;color:var(--forest);font-weight:700;text-decoration:underline;padding:0}
.pinbox{margin:6vh auto}
.periods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:20px}
.per{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.rr{font-size:13px;color:var(--soft);margin:2px 0 8px}.rr b{color:var(--ink,#1C2420)}.rr .up{color:#1F7A4D;font-weight:700}.rr .down{color:#A4502E;font-weight:700}
.per h3{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.per .tot{font-family:'Instrument Sans',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.per .split{margin-top:8px;font-size:13px;color:var(--soft);display:flex;flex-direction:column;gap:2px}
.per .split b{color:var(--ink);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:20px}
.panel h3{margin:0 0 12px;font-size:16px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--soft);margin-bottom:10px}
.mtable{width:100%;border-collapse:collapse;font-size:15px}
.mtable th,.mtable td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
@media (max-width:760px){.addjob{float:none;display:block;width:100%;margin-bottom:12px}.mtable{font-size:13px}.mtable th,.mtable td{padding:8px 4px}.per .tot{font-size:22px}.periods{grid-template-columns:repeat(2,minmax(0,1fr))}.periods .per:last-child{grid-column:1/-1}}
.empty{padding:56px 20px;text-align:center;color:var(--soft);background:#fff;border:1px dashed var(--line);border-radius:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:16px;align-items:center;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:9}
.toast button{background:none;border:0;color:var(--peach);font-weight:700}
@media (max-width:760px){
  .top{padding:10px 14px;flex-wrap:wrap}.search{order:3;max-width:none;flex-basis:100%}
  main{padding:16px 12px 80px}
  .queues{grid-template-columns:repeat(5,minmax(112px,1fr));overflow-x:auto;margin:0 -12px 18px;padding:0 12px 4px}
  .card{grid-template-columns:minmax(0,1fr);padding:14px}
  .row2{grid-template-columns:minmax(0,1fr)}
  .head{flex-direction:column;gap:2px}
  .go{width:100%}
  .detail{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<header class="top"><div class="logo">express<i>.</i></div>
<div class="search" id="search-wrap" hidden><input type="search" id="q" placeholder="Search name, order, phone or suburb" aria-label="Search orders"></div>
<button type="button" class="out" id="revbtn" hidden>Revenue</button><button type="button" class="out" id="signout" hidden>Sign out</button></header>
<main>
<form class="login" id="login" hidden>
<h1>Orders tracker</h1>
<p class="msg">Enter your Express email address and we will send you a sign-in link.</p>
<input type="email" name="email" required placeholder="you@expresspathology.com.au" autocomplete="email" aria-label="Email address">
<button class="btn" type="submit">Email me a sign-in link</button>
<p class="msg" id="login-msg" role="status"></p>
</form>
<section id="board" hidden>
<div class="sections" id="sections" role="tablist" aria-label="Business"></div>
<button type="button" class="addjob" id="rtest" hidden>Send me a test results email</button>
<button type="button" class="addjob" id="addjob">+ Add MIRAIT jobs</button>
<form class="jobform" id="jobform" hidden><h3>Add MIRAIT jobs</h3><div class="form"><label>Workers<textarea name="workers" id="jobworkers" rows="6" required placeholder="Paste the names from the email, one per line. A phone number on the same line is picked up too."></textarea></label><p class="msg" id="jobcount"></p><div class="row2"><label>Tests per worker<input name="qty" type="number" min="1" max="50" value="1" required></label><label>Date of the job<input name="job_date" type="date"></label></div><label>Address or site<input name="address"></label><label>Note<textarea name="note" placeholder="Subcontractor, site contact or anything from the email"></textarea></label><div class="row2"><button class="btn" type="submit" id="jobsubmit">Add jobs</button><button class="btn light" type="button" id="jobcancel">Cancel</button></div><p class="msg" id="jobmsg" role="status"></p></div></form>
<nav class="queues" id="queues" aria-label="Work queues"></nav>
<p class="shopnote" id="shopnote" hidden></p>
<div class="head"><h2 id="title"></h2><p id="hint"></p></div>
<div id="list"></div>
<datalist id="nurses"></datalist>
</section>
<section id="revenue" hidden>
<div class="head"><h2>Revenue</h2><p><button type="button" class="linkbtn" id="revback">Back to orders</button></p></div>
<form class="login pinbox" id="pinform"><h1>Enter PIN</h1><p class="msg">Revenue is locked. Enter the PIN to view it.</p><input type="password" inputmode="numeric" autocomplete="off" name="pin" required aria-label="PIN" maxlength="12"><button class="btn" type="submit">Unlock</button><p class="msg" id="pinmsg" role="status"></p></form>
<div id="revbody" hidden></div>
</section>
</main>
<div class="toast" id="toast" hidden role="status"><span id="toast-msg"></span><button type="button" id="undo">Undo</button></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var section = 'ep', shopNote = '', KEY = 'ep-admin-token', token = '', orders = [], view = 'book', q = '', openId = '', undo = null, toastT;
  var STAGES = [['paid', 'Paid'], ['form_sent', 'Form sent'], ['booked', 'Booked'], ['collected', 'Collected'], ['dropped', 'Dropped at lab'], ['results_in', 'Results in'], ['review', 'With Jai'], ['sent', 'Sent to patient']];
  var GP_STAGES = ['paid', 'booked', 'dropped'];
  // Work queues: what needs doing next
  var QUEUES = [
    ['book', 'To book', 'Home visits paid and waiting for a booking.'],
    ['collect', 'Awaiting collection', 'Booked visits, and patients who still need to visit a centre.'],
    ['results', 'Awaiting results', 'Collected and waiting for the lab.'],
    ['jai', 'With Jai', 'Results in, or being reviewed by Jai.'],
    ['done', 'Done', 'Results sent to the patient, or GP-form bloods dropped at the lab.']
  ];
  function isHome(o) { return o.type === 'own-form' || o.type === 'referral' || o.type === 'job' || /home/i.test(o.collection); }
  function queueOf(o) {
    if (o.stage === 'sent' || o.stage === 'dropped') return 'done';
    if (o.type === 'own-form') return o.stage === 'paid' || o.stage === 'form_sent' ? 'book' : 'collect'; // results go to their own doctor
    if (o.stage === 'results_in' || o.stage === 'review') return 'jai';
    if (o.stage === 'collected') return 'results';
    if (o.stage === 'booked') return 'collect';
    return isHome(o) ? 'book' : 'collect';
  }
  // The one next step for each order
  function nextStep(o) {
    var qu = queueOf(o);
    if (qu === 'book') return { label: 'Book visit', open: true };
    if (qu === 'collect' && o.type === 'own-form') return { label: 'Dropped at lab', stage: 'dropped' };
    if (qu === 'collect') return { label: 'Mark collected', stage: 'collected' };
    if (qu === 'results') return { label: 'Results in', stage: 'results_in' };
    if (o.type === 'job' && (o.stage === 'results_in' || o.stage === 'review')) return { label: 'Sent to ' + (o.partner || 'partner'), stage: 'sent' };
    if (canEmail(o) && (o.stage === 'results_in' || o.stage === 'review')) return { label: 'Email results', open: true };
    if (isPZ(o) && (o.stage === 'results_in' || o.stage === 'review')) return { label: 'Mark results sent', stage: 'sent' };
    if (o.stage === 'results_in') return { label: 'Send to Jai', stage: 'review' };
    if (o.stage === 'review') return { label: 'Mark sent', stage: 'sent' };
    return null;
  }
  function kind(o) { return o.type === 'own-form' ? 'gp' : o.type === 'referral' ? 'ref' : o.type === 'job' ? 'job' : o.type === 'shopify' ? 'pz' : 'pvt'; }
  function kindLabel(o) { var k = kind(o); return k === 'gp' ? 'Home visit · own GP form' : k === 'ref' ? 'Partner referral' : k === 'job' ? (o.partner || 'Partner') + ' job' : k === 'pz' ? (o.partner || 'Shopify') + (isHome(o) ? ' · home visit' : ' · centre') : (isHome(o) ? 'Private test · home visit' : 'Private test · centre'); }
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var money = new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD' });
  var dfmt = new Intl.DateTimeFormat('en-AU', { day: 'numeric', month: 'short' });
  var tfmt = new Intl.DateTimeFormat('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  var afmt = new Intl.DateTimeFormat('en-AU', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  var appt = function (a) { var d = new Date(a); return isNaN(d) ? a : afmt.format(d); };
  function store(t) { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} }
  try { token = localStorage.getItem(KEY) || ''; view = localStorage.getItem('ep-admin-view') || 'book'; section = localStorage.getItem('ep-admin-section') || 'ep'; } catch (e) {}
  var u = new URLSearchParams(location.search);
  if (u.get('t')) { token = u.get('t'); store(token); history.replaceState(null, '', '/admin'); }

  function api(method, body) {
    return fetch('/api/admin/orders', { method: method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { if (r.status === 401) { signOut(); throw new Error('auth'); } return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Error'); return j; }); });
  }
  // Results email (Primal Zone): the PDF goes to the email on the Shopify order
  function resultsBox(o) {
    var rs = String(o.resultsSent || '').split('|');
    return '<div class="rbox" data-rbox="' + esc(o.id) + '"><h4>Email results to patient</h4>' +
      (rs[0] ? '<p class="sent">Results emailed to ' + esc(rs[2] || o.email) + ' on ' + tfmt.format(new Date(rs[0])) + (rs[1] ? ' by ' + esc(rs[1].split('@')[0]) : '') + '</p>' : '') +
      (o.email ? '<p>To <strong>' + esc(o.email) + '</strong>. Choose the results PDF, check the name, then send.</p><input type="file" accept="application/pdf,.pdf" multiple data-rfile><button class="btn" type="button" data-rsend disabled>' + (rs[0] ? 'Send again' : 'Send results') + '</button><p class="msg" data-rmsg role="status"></p>'
        : '<p>This order has no patient email in Shopify, so results cannot be emailed from here.</p>') + '</div>';
  }
  function readFile(f) { return new Promise(function (ok, bad) { var r = new FileReader(); r.onload = function () { ok({ name: f.name, data: String(r.result).split(',')[1] || '' }); }; r.onerror = function () { bad(new Error('Could not read ' + f.name)); }; r.readAsDataURL(f); }); }
  document.addEventListener('change', function (e) {
    if (!e.target.matches('[data-rfile]')) return;
    var box = e.target.closest('[data-rbox]'), fs = [].slice.call(e.target.files || []), size = fs.reduce(function (a, f) { return a + f.size; }, 0);
    var bad = fs.filter(function (f) { return !/\.pdf$/i.test(f.name); });
    box.querySelector('[data-rmsg]').textContent = bad.length ? bad[0].name + ' is not a PDF.' : size > 3 * 1048576 ? 'Over 3 MB together. Send one file at a time.' : fs.length ? fs.map(function (f) { return f.name; }).join(', ') : '';
    box.querySelector('[data-rsend]').disabled = !fs.length || !!bad.length || size > 3 * 1048576;
  });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-rsend]'); if (!btn) return;
    var box = btn.closest('[data-rbox]'), id = box.getAttribute('data-rbox'), o = orders.find(function (x) { return x.id === id; }), input = box.querySelector('[data-rfile]'), msg = box.querySelector('[data-rmsg]');
    if (!o || !input.files.length) return;
    btn.disabled = true; msg.textContent = 'Sending to ' + o.email + '…';
    Promise.all([].slice.call(input.files).map(readFile)).then(function (files) {
      return fetch('/api/admin/results', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, files: files, confirm_to: o.email }) })
        .then(function (r) { if (r.status === 401) { signOut(); throw new Error('auth'); } return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'The email did not send. Try again.'); return j; }); });
    }).then(function (j) {
      o.stage = 'sent'; o.resultsSent = j.updated + '|' + j.by + '|' + j.to; o.updated = j.updated; o.by = j.by;
      toast('Results emailed to ' + j.to + ' from ' + (j.from || '') + ', copy to express@'); render();
    }).catch(function (er) { btn.disabled = false; if (er.message !== 'auth') msg.textContent = er.message; });
  });
  function signOut() { store(''); token = ''; show(); }
  function show() {
    $('login').hidden = !!token; $('board').hidden = !token; $('search-wrap').hidden = !token; $('signout').hidden = !token; $('revbtn').hidden = !token; $('revenue').hidden = true;
    if (token) load();
  }
  function load() {
    $('list').innerHTML = '<div class="empty">Loading orders…</div>';
    api('GET').then(function (j) { orders = j.orders; shopNote = j.shopify && j.shopify.status === 'error' ? 'Primal Zone orders could not be loaded from Shopify: ' + j.shopify.error : ''; render(); })
      .catch(function (e) { if (e.message !== 'auth') $('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  function overdue(o) { return queueOf(o) !== 'done' && (Date.now() / 1000 - o.date) / 86400 >= 7; }
  // Sections: Express, Primal Zone, MIRAIT jobs and LSG (partner referrals) each run as their own flow
  var SECTIONS = [['ep', 'Express'], ['pz', 'Primal Zone'], ['mirait', 'MIRAIT'], ['lsg', 'LSG']];
  function secOf(o) { var k = kind(o); return k === 'pz' ? 'pz' : k === 'job' ? 'mirait' : k === 'ref' ? 'lsg' : 'ep'; }

    var q = function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; };
    var csv = 'Date,Order,Patient,Tests,Type,Value\n' + lastInv.map(function (x) { return [x.date, x.order, x.patient, x.items, x.reason, x.value.toFixed(2)].map(q).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = invPartner.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-invoice-' + invMonth + '.csv'; a.click();
  });
  $('revbtn').addEventListener('click', openRevenue);
  $('revback').addEventListener('click', closeRevenue);
  $('pinform').addEventListener('submit', function (e) { e.preventDefault(); pin = String(new FormData(this).get('pin') || ''); try { sessionStorage.setItem('ep-rev-pin', pin); } catch (x) {} $('pinmsg').textContent = ''; this.reset(); loadRevenue(); });
  // Turns pasted email text into workers: one per line (or comma separated on a single line), strips numbering,
  // bullets and headings, and picks up an Australian phone number on the same line
  function parseWorkers(txt) {
    var lines = String(txt || '').split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    if (lines.length === 1 && lines[0].indexOf(',') > -1 && !/\d{6}/.test(lines[0])) lines = lines[0].split(',');
    var seen = {};
    return lines.map(function (l) {
      var ph = (l.match(/(\+?61\s?|0)4(?:[\s-]?\d){8}/) || [''])[0];
      var name = l.replace(ph, '').replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, '').replace(/^\s*(?:\d+[.)]|[-*•·]|\(\d+\))\s*/, '').replace(/\t+/g, ' ').replace(/[,;:|–-]+\s*$/, '').replace(/^[,;:|–-]+\s*/, '').replace(/\s{2,}/g, ' ').trim();
      return { name: name, phone: ph.replace(/[\s-]/g, '') };
    }).filter(function (w) { var k = w.name.toLowerCase(); if (!w.name || w.name.length < 2 || /^(name|names|worker|workers|employee|employees|hi|hello|thanks|thank you|regards|cheers)\b/i.test(w.name) || seen[k]) return false; seen[k] = 1; return true; });
  }
  $('jobworkers').addEventListener('input', function () { var n = parseWorkers(this.value).length, q = Number($('jobform').qty.value) || 1; $('jobcount').textContent = n ? n + ' worker' + (n === 1 ? '' : 's') + ' · ' + n + ' job' + (n === 1 ? '' : 's') + ' · ' + aud2.format(n * q * 258.5) + ' incl. GST' : ''; });
  $('rtest').addEventListener('click', function () {
    var btn = this; btn.disabled = true; btn.textContent = 'Sending…';
    fetch('/api/admin/results', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ test: true }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'The test email did not send.'); return j; }); })
      .then(function (j) { toast('Test sent to ' + j.to + (j.from ? ' from ' + j.from : '')); }).catch(function (er) { toast(er.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'Send me a test results email'; });
  });
  $('addjob').addEventListener('click', function () { $('jobform').hidden = false; $('jobmsg').textContent = ''; $('jobworkers').focus(); });
  $('jobcancel').addEventListener('click', function () { $('jobform').hidden = true; });
  $('jobform').addEventListener('submit', function (e) {
    e.preventDefault();
    var d = Object.fromEntries(new FormData(this).entries()), ws = parseWorkers(d.workers); delete d.workers;
    if (!ws.length) { $('jobmsg').textContent = 'Paste at least one worker name.'; return; }
    d.action = 'create_job'; d.partner = 'MIRAIT'; d.workers = ws;
    $('jobmsg').textContent = 'Adding ' + ws.length + ' job' + (ws.length === 1 ? '' : 's') + '…'; $('jobsubmit').disabled = true;
    var f = this;
    api('POST', d).then(function (j) { $('jobsubmit').disabled = false; f.reset(); $('jobcount').textContent = ''; f.hidden = true; var o = j.orders || [j.order]; toast(o.length + ' MIRAIT job' + (o.length === 1 ? '' : 's') + ' added (' + o[0] + (o.length > 1 ? ' to ' + o[o.length - 1] : '') + ')'); load(); }).catch(function (er) { $('jobsubmit').disabled = false; if (er.message !== 'auth') $('jobmsg').textContent = er.message; });
  });
  $('undo').addEventListener('click', function () { if (undo) undo(); $('toast').hidden = true; });
  $('q').addEventListener('input', function () { q = this.value.trim().toLowerCase(); openId = ''; render(); });
  $('signout').addEventListener('click', signOut);
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    $('login-msg').textContent = 'Sending…';
    fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: new FormData(this).get('email') }) })
      .then(function () { $('login-msg').textContent = 'If that address has access, a sign-in link is on its way. Check your inbox.'; })
      .catch(function () { $('login-msg').textContent = 'Could not send the link. Try again.'; });
  });
  setInterval(function () { if (token && !openId && document.visibilityState === 'visible') api('GET').then(function (j) { orders = j.orders; render(); }).catch(function () {}); }, 120000);
  show();
})();
</script>
